<section class="contact bg-[#222222] py-2">
  <div class="custom-scroll-panel">
    <div class="contact-content pt-[30px]">
      <app-main-title [title]="'Contact Form'"></app-main-title>
      <div class="text-white py-6 px-6 md:px-16">
        <!-- Form -->
        <form
          (ngSubmit)="sendEmail()"
          #contactForm="ngForm"
          class="space-y-8 p-8 rounded-xl w-full max-w-lg"
        >
          <div class="grid md:grid-cols-2 gap-8">
            <div>
              <label for="fullName" class="block mb-2 opacity-70"
                >Full Name</label
              >
              <input
                type="text"
                id="fullName"
                name="fullName"
                [(ngModel)]="formData.fullName"
                placeholder="Enter your full name"
                class="w-full bg-transparent border-b border-[#444] focus:border-[#f6b846] outline-none py-2"
                required
              />
            </div>

            <div>
              <label for="email" class="block mb-2 opacity-70"
                >Email Address</label
              >
              <input
                type="email"
                id="email"
                name="email"
                [(ngModel)]="formData.email"
                placeholder="Enter your email"
                class="w-full bg-transparent border-b border-[#444] focus:border-[#f6b846] outline-none py-2"
                required
              />
            </div>
          </div>

          <div>
            <label for="message" class="block mb-2 opacity-70"
              >Your Message</label
            >
            <textarea
              id="message"
              name="message"
              [(ngModel)]="formData.message"
              placeholder="Write your message here"
              rows="4"
              class="w-full bg-transparent border-b border-[#444] focus:border-[#f6b846] outline-none py-2"
              required
            ></textarea>
          </div>

          <button
            type="submit"
            class="uppercase tracking-wide font-semibold mt-6 flex items-center gap-2 hover:opacity-75 transition text-[#f6b846]"
          >
            Send Message
            <span class="text-lg">→</span>
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
